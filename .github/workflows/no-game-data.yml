name: No game data

# Fails any push or PR that adds ROMs, original assets or decompile workspaces,
# even if someone force-adds them past .gitignore.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only allowed top-level paths
        run: |
          bad=$(git ls-files | grep -Ev \
            -e '^\.gitignore$' \
            -e '^\.github/' \
            -e '^src/' \
            -e '^README\.md$' \
            -e '^LICENSE$' \
            -e '^Supported Games\.txt$' \
            -e '^UN64 Patcher\.exe$' \
          || true)
          if [ -n "$bad" ]; then
            echo "::error::Files outside the allowed paths (decompile folders, assets, notes?):"
            echo "$bad"
            exit 1
          fi

      - name: No ROMs, firmware or disassembly
        run: |
          bad=$(git ls-files | grep -Ei '\.(z64|n64|v64|rom|ndd|d64|bin|elf|s|asm|zip|7z|rar)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Game data / disassembly files must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: No renamed ROMs (N64 header check)
        run: |
          found=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            magic=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            case "$magic" in
              80371240|37804012|40123780) found="$found$f\n" ;;
            esac
          done < <(git ls-files)
          if [ -n "$found" ]; then
            echo "::error::Files with an N64 ROM header were found:"
            printf "$found"
            exit 1
          fi
          echo "Clean: no game data in the repository."
